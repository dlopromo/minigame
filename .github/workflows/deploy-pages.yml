name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Firebase runtime config
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo "::error title=Missing FIREBASE_CONFIG_JSON secret::Add a repository or github-pages environment secret named FIREBASE_CONFIG_JSON. It must contain the Firebase web config JSON with apiKey, authDomain, projectId, appId, and databaseURL."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const raw = process.env.FIREBASE_CONFIG_JSON || '';
          let config;
          try {
            config = JSON.parse(raw);
          } catch (error) {
            throw new Error(`FIREBASE_CONFIG_JSON must be valid JSON: ${error.message}`);
          }
          const required = ['apiKey','authDomain','projectId','appId','databaseURL'];
          for (const key of required) {
            if (!config[key]) throw new Error(`Missing Firebase config key: ${key}`);
          }
          fs.writeFileSync(
            'js/firebaseConfig.generated.js',
            'var App = window.App || {};\\n' +
            'App.FirebaseConfig = ' + JSON.stringify(config, null, 2) + ';\\n' +
            'window.App = App;\\n'
          );
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
