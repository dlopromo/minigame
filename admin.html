<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MiniGame Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6a4d'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' font-family='Arial, sans-serif' font-size='30' font-weight='700' fill='white'%3EMU%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/lobby.css">
</head>
<body>
<div class="toast-container" id="toast-container"></div>
<main class="screen active admin-screen">
  <div class="card room-card">
    <div class="room-code-line">
      <div>
        <span class="room-eyebrow">Admin</span>
        <strong>Party Rooms</strong>
      </div>
      <a class="btn-small btn-copy" href="index.html">返回遊戲</a>
    </div>
    <p class="room-role-label">監控 Firebase rooms、在線玩家、AI 接管、歷史紀錄與排行榜。</p>
    <div class="admin-lock" id="admin-lock">
      <input type="password" id="admin-pin-input" class="text-input" placeholder="Admin PIN" autocomplete="off">
      <button class="btn btn-primary" onclick="App.Admin.unlock()">解鎖 Admin</button>
      <p class="room-config-note" id="admin-lock-note"></p>
    </div>
  </div>
  <div class="room-debug-panel admin-debug-panel" id="admin-summary"></div>
  <div class="card room-party-card">
    <div class="room-code-line">
      <div>
        <span class="room-eyebrow">Maintenance</span>
        <strong>全局清理工具</strong>
      </div>
    </div>
    <div class="admin-actions" id="admin-global-actions">
      <button class="btn-small btn-copy" data-global-admin-action="delete-empty-rooms">刪除空房</button>
      <button class="btn-small btn-copy" data-global-admin-action="delete-closed-rooms">刪除已關閉房</button>
      <button class="btn-small btn-danger" data-global-admin-action="delete-stale-rooms">刪除過舊房間</button>
    </div>
  </div>
  <div class="card room-party-card">
    <div class="room-code-line">
      <div>
        <span class="room-eyebrow">Games</span>
        <strong>遊戲開關</strong>
      </div>
    </div>
    <p class="room-config-note">停用後，玩家仍會看到該遊戲，但不能在本機或 Party Room 開局。</p>
    <div class="admin-game-list" id="admin-game-list"></div>
  </div>
  <div class="admin-layout">
    <section class="card room-party-card">
      <h2>房間列表</h2>
      <div class="room-list" id="admin-room-list"></div>
    </section>
    <section class="card room-party-card">
      <h2 id="admin-room-title">房間詳情</h2>
      <div id="admin-room-detail" class="admin-detail-empty">選擇一個房間</div>
    </section>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="js/common.js"></script>
<script src="js/firebaseConfig.js"></script>
<script src="js/firebaseConfig.generated.js"></script>
<script src="js/firebaseConfig.local.js"></script>
<script src="js/gameManager.js?v=20260604-game-settings"></script>
<script src="games/guessColor/guessColor.js"></script>
<script src="games/bigDee/bigDee.js"></script>
<script src="games/douDizhu/douDizhu.js"></script>
<script src="games/blackjack/blackjack.js"></script>
<script src="games/tile2048/tile2048.js"></script>
<script src="games/colorShift/colorShift.js"></script>
<script src="games/snapStack/snapStack.js"></script>
<script src="games/nineUpper/nineUpper.js"></script>
<script src="games/baccarat/baccarat.js"></script>
<script src="games/sicBo/sicBo.js"></script>
<script src="js/admin.js?v=20260604-game-settings"></script>
</body>
</html>
